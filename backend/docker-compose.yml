name: soccera

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soccera
      POSTGRES_PASSWORD: soccera
      POSTGRES_DB: soccera
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soccera -d soccera"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingestion:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://soccera:soccera@postgres:5432/soccera
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python scripts/run_live_poll.py"
    restart: unless-stopped

volumes:
  pgdata:
