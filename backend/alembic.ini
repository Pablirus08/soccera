[alembic]
script_location = src/soccera/storage/migrations
prepend_sys_path = . src
version_path_separator = os

# sqlalchemy.url is intentionally omitted here — env.py reads it from
# soccera.config.get_settings() so a single DATABASE_URL env var drives
# both the app and migrations.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
